<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Асанбай Құрманбаев: өмір жолы мен қайраткерлігі</title>
<style>
:root{--bg:#fbf5e6;--bg2:#f3e9cf;--card:#fffdf8;--tx:#2a2418;--mut:#6b6048;--line:#e6d9b8;--g:#1f7a4d;--g2:#14573a;--gold:#f0a91c;--tc:#d9582b;--bl:#2f6fe4;--ok:#128a52;--okBg:#dcf5e7;--bad:#c62f2f;--badBg:#fde6e3;--warn:#9a5b00;--sh:0 6px 18px rgba(80,60,20,.13);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111b15;--bg2:#1a2a21;--card:#1b2a22;--tx:#f3eee0;--mut:#b9b095;--line:#2f4a3b;--g:#4fd08c;--g2:#2a8f5d;--gold:#ffc84a;--tc:#ff8a5c;--bl:#7ba8ff;--ok:#5fd39a;--okBg:#0f3a28;--bad:#ff8f8f;--badBg:#4a1d1d;--warn:#ffc46b;--sh:0 6px 18px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#111b15;--bg2:#1a2a21;--card:#1b2a22;--tx:#f3eee0;--mut:#b9b095;--line:#2f4a3b;--g:#4fd08c;--g2:#2a8f5d;--gold:#ffc84a;--tc:#ff8a5c;--bl:#7ba8ff;--ok:#5fd39a;--okBg:#0f3a28;--bad:#ff8f8f;--badBg:#4a1d1d;--warn:#ffc46b;--sh:0 6px 18px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 70px}
h2{font-size:1.15rem;margin:18px 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
.hero{position:relative;border-radius:22px;overflow:hidden;margin:0 0 16px;box-shadow:var(--sh);background:linear-gradient(135deg,#14573a,#1f7a4d 55%,#f0a91c);color:#fff;min-height:200px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .tx{position:relative;padding:24px 22px 70px;max-width:620px}
.hero h1{font:800 clamp(1.4rem,5vw,2.1rem)/1.15 Georgia,"Noto Serif","Times New Roman",serif;margin:0 0 8px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hero p{margin:0;opacity:.95;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.pills{position:absolute;left:18px;right:18px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.pills span{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 12px;font-size:.84rem;font-weight:600;backdrop-filter:blur(4px)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
label.f{display:block;font-weight:700;margin-bottom:6px}
input[type=text],textarea{width:100%;padding:12px 14px;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--line);border-radius:12px}
input[type=text]:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--g) 40%,transparent);border-color:var(--g)}
textarea{min-height:120px;resize:vertical}
[aria-invalid=true]{border-color:var(--bad)!important}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;color:var(--mut);cursor:pointer}.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--g);flex:none}
.err{color:var(--bad);font-weight:700;margin:8px 0 0}.err:empty{display:none}.note{color:var(--warn);margin:8px 0 0}.note:empty{display:none}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px 0;margin-bottom:6px}
.pbar{height:12px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden}.pbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--gold));border-radius:99px;transition:width .35s}
.pt{font-size:.88rem;color:var(--mut);margin-top:4px;font-weight:600}
.h{display:block;color:#fff;border-radius:14px;padding:10px 16px;font-size:1.1rem;margin:28px 0 14px;box-shadow:var(--sh)}
.s1{background:linear-gradient(90deg,var(--g2),var(--g))}.s2{background:linear-gradient(90deg,#b5401c,var(--tc))}.s3{background:linear-gradient(90deg,#1f55b8,var(--bl))}
fieldset{border:2px solid var(--line);border-left:7px solid var(--g);background:var(--card);border-radius:18px;margin:0 0 16px;padding:12px 14px 6px;min-width:0;box-shadow:var(--sh)}
fieldset[data-sec="2"]{border-left-color:var(--tc)}fieldset[data-sec="3"]{border-left-color:var(--bl)}
fieldset.miss{border-color:var(--bad);box-shadow:0 0 0 4px var(--badBg)}
legend{padding:2px 14px;font-weight:800;font-size:.85rem;color:#fff;background:var(--g);border-radius:99px}
fieldset[data-sec="2"] legend{background:var(--tc)}fieldset[data-sec="3"] legend{background:var(--bl)}
.qt{font-weight:700;margin:6px 0 12px;overflow-wrap:anywhere;font-size:1.04rem}
.ops{display:grid;gap:10px;margin-bottom:10px}.ops.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:center;padding:11px 14px;border:2px solid var(--line);background:var(--bg);border-radius:14px;cursor:pointer;overflow-wrap:anywhere;min-height:48px;transition:transform .12s,box-shadow .12s,border-color .12s}
.opt:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--g)}
.opt input{width:18px;height:18px;accent-color:var(--g);flex:none}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg2);color:var(--g2);display:grid;place-items:center;font-size:.85rem}
.opt:has(input:checked){border-color:var(--g);background:color-mix(in srgb,var(--g) 15%,var(--card));font-weight:600}
.opt:has(input:checked) b{background:var(--g);color:#fff}
.ops.tf .opt{justify-content:center;text-align:center;font-weight:700;font-size:1.05rem}
.opt.ok{border-color:var(--ok);background:var(--okBg);animation:pop .4s}.opt.no{border-color:var(--bad);background:var(--badBg);animation:shake .4s}
.opt.ok::after{content:"✓";margin-left:auto;font-weight:900;color:var(--ok)}.opt.no::after{content:"✗";margin-left:auto;font-weight:900;color:var(--bad)}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{font-size:.92rem;margin:0 0 8px;font-weight:700;overflow-wrap:anywhere}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.cnt{font-size:.82rem;color:var(--mut);text-align:right;margin:2px 0 8px}
button{font:inherit;font-weight:700;border-radius:14px;padding:13px 22px;border:2px solid var(--g);cursor:pointer;min-height:46px;transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.pri{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-color:transparent}.sec{background:transparent;color:var(--g)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
#sub{font-size:1.1rem;padding:15px 30px}
#res{border:3px solid var(--gold)}
.gauge{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:6px 0 10px;color:var(--tx)}
.medal{font-size:3rem;line-height:1;text-align:center}.medal b{display:block;font-size:1.3rem;margin-top:4px}
.tp{margin:10px 0}.tp div.r{display:flex;justify-content:space-between;gap:8px;font-size:.94rem;font-weight:600}.tp .pbar{height:12px;margin-top:4px}.tp .pbar b{background:linear-gradient(90deg,var(--g),var(--gold))}
.an{border-left:5px solid var(--bad);background:var(--badBg);border-radius:0 12px 12px 0;padding:8px 12px;margin:10px 0;overflow-wrap:anywhere}
.an p,.oa p{margin:2px 0}.oa{border-left:5px solid var(--bl);background:color-mix(in srgb,var(--bl) 10%,var(--card));border-radius:0 12px 12px 0;padding:8px 12px;margin:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.hist{font-size:.9rem;color:var(--mut);padding-left:18px;margin:6px 0 0}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
[hidden]{display:none!important}
@media(max-width:480px){.ops.tf{grid-template-columns:1fr}.hero .tx{padding:18px 16px 76px}}
@media(max-width:380px){.wrap{padding:10px 8px 50px}.opt{padding:9px 10px}button{padding:11px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff;color:#000}.stick,.btns,#start,#qs,#subRow,#subErr,.sub,.hero{display:none!important}.card{box-shadow:none}}
</style></head><body>
<a href="index.html#tasks" style="position:fixed;bottom:12px;left:12px;z-index:2147483647;padding:8px 14px;border:1px solid #e5b971;border-radius:8px;background:#102739;color:#fff;font:14px Arial,sans-serif;text-decoration:none;box-shadow:0 2px 10px #0003" aria-label="Тапсырмалар бөліміне қайту">← Тапсырмалар</a><div class="wrap">
<header class="hero"><svg viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><circle cx="660" cy="64" r="36" fill="#ffe08a"/><path d="M0 220V130L110 70 220 140 330 60 460 150 570 90 700 160 800 110V220Z" fill="#14573a" opacity=".55"/><path d="M0 220V160L150 120 300 170 450 130 620 175 800 140V220Z" fill="#0d3a27"/><path d="M0 200Q200 180 400 200T800 190M0 212Q200 192 400 212T800 202" stroke="#2f9c66" stroke-width="3" fill="none" opacity=".7"/></svg><div class="tx"><h1>Асанбай Құрманбаевтың өмір жолы мен қайраткерлігі</h1><p>Түлкібас өңірінің тарихи тұлғасы туралы тест пен тапсырмалар</p></div><div class="pills"><span>12 ұпайлы сұрақ</span><span>3 ашық сұрақ</span><span>Интернетсіз жұмыс істейді</span></div></header>

<div class="card" id="start">
 <label class="f" for="nm">Аты-жөніңіз</label>
 <input type="text" id="nm" maxlength="60" autocomplete="name" placeholder="Мысалы: Айдос Серіков" aria-describedby="nmErr">
 <p class="err" id="nmErr" role="alert"></p>
 <label class="chk"><input type="checkbox" id="sv"> Нәтижені осы құрылғыда сақтау</label>
</div>

<div class="stick" id="stick"><div class="pbar"><b id="pb"></b></div><div class="pt" id="pt"></div></div>
<div id="qs"></div>
<p class="err" id="subErr" role="alert"></p>
<div class="btns" id="subRow"><button class="pri" id="sub">Тестті аяқтау</button></div>

<div class="card" id="res" hidden tabindex="-1" aria-live="polite"></div>
</div>
<script>
const TF=8,Q=[
["Асанбай Құрманбаев қай жылы дүниеге келген?",["1903 жылы","1905 жылы","1910 жылы","1919 жылы"],[1]],
["Тарихи деректерге сәйкес, А. Құрманбаев қай өңірдің тумасы?",["Мақтаарал ауданы","Келес ауданы","Түлкібас ауданы","Сайрам ауданы"],[2]],
["1919–1928 жылдары Асанбай Құрманбаев кім болып еңбек етті?",["Колхоз төрағасы","Зауыт жұмысшысы","Сериков пен Петровтың қолында батырақ","Кеңес үкіметінің шенеунігі"],[2]],
["Ол өзінің еңбек жолын және басшылық қызметін қай шаруашылықта өткізді?",["«Қызыл Құралай» артелі","«Амангелді» колхозы","«Пахтаарал» совхозы","«Заканар» артелі"],[1]],
["1939 жылы А. Құрманбаев жоғары жетістіктері үшін қандай шараға қатысу құрметіне ие болды?",["Бүкілодақтық ауыл шаруашылығы көрмесіне (ВСХВ)","Партияның съезіне","Республикалық мақташылар құрылтайына","Нижегород жәрмеңкесіне"],[0]],
["1942 жылы Асанбай Құрманбаев қандай негізсіз айыппен тұтқындалып, сотқа тартылды?",["Мақта жоспарын орындамағаны үшін","Колхоздың бір айғырын жоғалтқаны үшін","Астықты жасырғаны үшін","Салық төлеуден жалтарғаны үшін"],[1]],
["1942 жылғы сот процесі қалай аяқталды?",["3 жылға сотталды","Сібірге жер аударылды","Қылмыстық құрамы болмағандықтан, ақталып шықты","Мүлкі тәркіленді"],[2]],
["А. Құрманбаев басқарған жылдары (соғыс уақытында) «Амангелді» колхозы мемлекеттік астық тапсыру жоспарын қанша пайызға орындады?",["90%","100%","150%","168%"],[3]],
["А. Құрманбаевтың арнайы жоғары агрономиялық білімі болған.",["Ақиқат","Жалған"],[1],"Мұрағат құжаттарында «малограмотный» деп көрсетілген."],
["Түлкібас ауданының табиғаты мақта өсіруге өте қолайлы болғандықтан, колхоз жоғары өнім берді.",["Ақиқат","Жалған"],[1],"Түлкібас климаты сәйкес келмейтін таулы аймақ."],
["А. Құрманбаев колхоз төрағасы болғанға дейін сушы (поливщик), звено басшысы, ферма меңгерушісі қызметтерінен өткен.",["Ақиқат","Жалған"],[0]],
["1942 жылғы тұтқындалудан кейін А. Құрманбаев басшылық қызметке қайта орала алмады.",["Ақиқат","Жалған"],[1],"Ақталып шыққан соң ол колхоз төрағасы болып қайта тағайындалды."]];
const O=["Кеңестік жазалау жүйесі қатаң жұмыс істеп тұрған 1942 жылы Асанбай Құрманбаевтың соттан ақталып шығуы оның қандай жеке қасиеттерін көрсетеді?",
"Табиғаты салқын, таулы Түлкібас өңірінде мақта егу саясаты неліктен тарихи және экономикалық парадокс болып саналады?",
"Асанбай Құрманбаевтың жеке іс-парағы (кадрлық құжаты) мен өз қолымен жазған өмірбаяны тарих ғылымы үшін, оның ішінде өлкетану үшін қандай құндылыққа ие?"];
const TP=[[0,8,'І бөлім. Білу және түсіну (1–8)'],[8,12,'ІІ бөлім. Талдау: Ақиқат / Жалған (9–12)']],L='АӘБВ',KEY='kt-qurmanbaev-results',MIN=15;
const $=s=>document.querySelector(s);let order,ans;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const txt=(i,a)=>a.slice().sort((x,y)=>x-y).map(o=>Q[i][1][o]).join('; ');
const oTxt=i=>$('#o'+i).value.trim();
function build(){
 order=Q.map((q,i)=>i>=TF?[0,1]:shuf([0,1,2,3]));ans=Q.map(()=>[]);
 const box=$('#qs');box.replaceChildren();
 box.append(el('h2','h s1','І. Бір дұрыс жауабы бар тест сұрақтары'));
 Q.forEach((q,i)=>{
  if(i===TF)box.append(el('h2','h s2','ІІ. «Ақиқат немесе Жалған»'));
  const fs=el('fieldset');fs.id='q'+i;fs.append(el('legend',null,'Сұрақ '+(i+1)),el('p','qt',q[0]));
  fs.dataset.sec=i<TF?'1':'2';const ops=el('div','ops'+(i>=TF?' tf':''));fs.append(ops);order[i].forEach((oi,k)=>{
   const lb=el('label','opt'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=oi;
   r.onchange=()=>{ans[i]=[oi];fs.classList.remove('miss');prog();$('#subErr').textContent=''};
   lb.append(r);if(i<TF)lb.append(el('b',null,L[k]+')'));lb.append(el('span',null,q[1][oi]));ops.append(lb)});
  box.append(fs)});
 box.append(el('h2','h s3','ІІІ. Қысқаша жауапты қажет ететін ашық сұрақтар'),el('p','sub','Бұл жауаптарды мұғалім тексереді, ұпайға кірмейді. Кемінде '+MIN+' таңба жазыңыз.'));
 O.forEach((t,i)=>{const fs=el('fieldset');fs.id='of'+i;fs.dataset.sec='3';fs.append(el('legend',null,'Сұрақ '+(13+i)),el('p','qt',t));
  const ta=document.createElement('textarea');ta.id='o'+i;ta.maxLength=1500;ta.setAttribute('aria-label',(13+i)+'-сұраққа жауап');
  const c=el('div','cnt','0 / 1500');ta.oninput=()=>{c.textContent=ta.value.length+' / 1500';ta.removeAttribute('aria-invalid');fs.classList.remove('miss');prog();$('#subErr').textContent=''};
  fs.append(ta,c);box.append(fs)});
 $('#res').hidden=true;$('#subRow').hidden=false;$('#stick').hidden=false;$('#nm').disabled=false;$('#sv').disabled=false;$('#subErr').textContent='';prog();
}
function prog(){const n=ans.filter(a=>a.length).length+O.filter((_,i)=>oTxt(i).length>=MIN).length,t=Q.length+O.length;$('#pb').style.width=n/t*100+'%';$('#pt').textContent='Жауап берілді: '+n+' / '+t}
function submit(){
 const nm=$('#nm'),v=nm.value.trim(),ne=$('#nmErr');
 if(v.length<2||v.length>60||!/\p{L}/u.test(v)){nm.setAttribute('aria-invalid','true');ne.textContent='Аты-жөніңізді жазыңыз (кемінде 2 әріп, 60 таңбадан аспасын).';nm.focus();nm.scrollIntoView({block:'center'});return}
 nm.removeAttribute('aria-invalid');ne.textContent='';
 const miss=[],mo=[];ans.forEach((a,i)=>{if(!a.length)miss.push(i)});O.forEach((_,i)=>{if(oTxt(i).length<MIN)mo.push(i)});
 if(miss.length||mo.length){miss.forEach(i=>$('#q'+i).classList.add('miss'));mo.forEach(i=>{$('#of'+i).classList.add('miss');$('#o'+i).setAttribute('aria-invalid','true')});
  $('#subErr').textContent=(miss.length?'Жауапсыз сұрақтар: '+miss.map(i=>i+1).join(', ')+'. ':'')+(mo.length?'Ашық сұраққа жауап жазыңыз (кемінде '+MIN+' таңба): '+mo.map(i=>13+i).join(', ')+'.':'');
  const f=miss.length?$('#q'+miss[0]):$('#of'+mo[0]);f.scrollIntoView({block:'center',behavior:'smooth'});return}
 finish(v)}
function gauge(sc,pc){const d=el('div','gauge'),C=2*Math.PI*54,col=pc>=70?'var(--ok)':pc>=50?'var(--gold)':'var(--bad)';
 d.innerHTML='<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="'+sc+' / '+Q.length+'"><circle cx="60" cy="60" r="54" fill="none" style="stroke:var(--bg2)" stroke-width="12"/><circle class="gc" cx="60" cy="60" r="54" fill="none" style="stroke:'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="30" font-weight="800" style="fill:currentColor">'+sc+'</text><text x="60" y="78" text-anchor="middle" font-size="12" style="fill:var(--mut)">/ '+Q.length+' ұпай</text></svg><div class="medal">'+(pc>=90?'🏆':pc>=70?'🥇':pc>=50?'🥈':'🌱')+'<b>'+pc+'%</b></div>';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=d.querySelector('.gc');g.style.transition='stroke-dashoffset 1s ease';g.style.strokeDashoffset=C*(1-pc/100)}));return d}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=['#f0a91c','#1f7a4d','#d9582b','#2f6fe4'],w=el('div','cf');for(let i=0;i<40;i++){const p=el('i');p.style.cssText='left:'+Math.random()*100+'%;background:'+c[i%4]+';animation-delay:'+Math.random()*.6+'s;animation-duration:'+(2+Math.random()*1.5)+'s';w.append(p)}document.body.append(w);setTimeout(()=>w.remove(),4500)}
function finish(name){
 let sc=0;const bad=[],tp=TP.map(()=>0);
 Q.forEach((q,i)=>{
  const fs=$('#q'+i),ok=same(ans[i],q[2]);if(ok){sc++;TP.forEach((t,k)=>{if(i>=t[0]&&i<t[1])tp[k]++})}else bad.push(i);
  fs.querySelectorAll('.opt').forEach((lb,k)=>{const oi=order[i][k];lb.querySelector('input').disabled=true;if(q[2].includes(oi))lb.classList.add('ok');else if(ans[i].includes(oi))lb.classList.add('no')});
  fs.append(el('p','fb '+(ok?'ok':'no'),ok?'Дұрыс':'Қате. Дұрыс жауап: '+txt(i,q[2])))});
 O.forEach((_,i)=>{$('#o'+i).readOnly=true});
 const pc=Math.round(sc/Q.length*100),r=$('#res');r.replaceChildren();
 r.append(el('h2',null,'Нәтиже: '+name),gauge(sc,pc),
  el('p',null,pc>=90?'Тамаша нәтиже!':pc>=70?'Жақсы нәтиже.':pc>=50?'Қанағаттанарлық. Қателерді талдап, тақырыпты қайталаңыз.':'Тақырыпты қайта оқып, тестті қайталап көріңіз.'),el('p','sub','Ашық сұрақтар (13–15) мұғалім тексеруіне жіберіледі, ұпайға кірмейді.'));
 TP.forEach((t,k)=>{const n=t[1]-t[0],d=el('div','tp'),row=el('div','r');row.append(el('span',null,t[2]),el('b',null,tp[k]+' / '+n));const b=el('div','pbar'),f=el('b');f.style.width=tp[k]/n*100+'%';b.append(f);d.append(row,b);r.append(d)});
 r.append(el('h2',null,bad.length?'Қателерді талдау ('+bad.length+')':'Қате жоқ!'));
 bad.forEach(i=>{const d=el('div','an'),q=Q[i];d.append(el('p',null,'№'+(i+1)+'. '+q[0]),el('p',null,'Сіздің жауабыңыз: '+txt(i,ans[i])),el('p',null,'Дұрыс жауап: '+txt(i,q[2])));if(q[3])d.append(el('p',null,'Түсіндірме: '+q[3]));r.append(d)});
 r.append(el('h2',null,'Ашық сұрақтарға жауаптарыңыз'));
 O.forEach((t,i)=>{const d=el('div','oa');d.append(el('p',null,'№'+(13+i)+'. '+t),el('p',null,oTxt(i)));r.append(d)});
 const sm=el('p','note');r.append(sm);
 if($('#sv').checked){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.unshift({n:name,s:sc,t:Q.length,d:new Date().toLocaleString('kk-KZ')});localStorage.setItem(KEY,JSON.stringify(a.slice(0,5)));sm.style.color='var(--ok)';sm.textContent='Нәтиже осы құрылғыда сақталды (ашық жауаптар сақталмайды).';
  r.append(el('p',null,'Соңғы сақталған нәтижелер:'));const u=el('ul','hist');a.slice(0,5).forEach(x=>u.append(el('li',null,x.d+': '+x.n+', '+x.s+'/'+x.t)));r.append(u)}catch(e){sm.textContent='Нәтижені сақтау мүмкін болмады: браузер жадқа рұқсат бермейді. Нәтиже тек осы бетте көрсетіледі.'}}
 const bt=el('div','btns'),re=el('button','pri','Қайта орындау');re.onclick=()=>{build();scrollTo({top:0,behavior:'smooth'})};
 const pr=el('button','sec','Басып шығару');pr.onclick=()=>print();bt.append(re,pr);r.append(bt);
 if(pc>=70)confetti();r.hidden=false;$('#subRow').hidden=true;$('#stick').hidden=true;$('#nm').disabled=true;$('#sv').disabled=true;r.focus();r.scrollIntoView({behavior:'smooth'})}
$('#sub').onclick=submit;
$('#nm').addEventListener('input',()=>{$('#nm').removeAttribute('aria-invalid');$('#nmErr').textContent=''});
build();
</script></body></html>
