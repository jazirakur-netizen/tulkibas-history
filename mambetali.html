<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мәмбетәлі Бағызбаевтың өмір жолы мен тағдыры</title>
<style>
:root{--bg:#f8f2ec;--bg2:#efe3da;--card:#fffdfb;--tx:#271f33;--mut:#6e6280;--line:#e5d6ca;--g:#3b3f9e;--g2:#272a74;--gold:#f2a541;--tc:#0f8b8d;--bl:#a3306f;--ok:#12805a;--okBg:#dcf4ea;--bad:#c4304a;--badBg:#fde5e9;--warn:#9a5b00;--sh:0 6px 18px rgba(70,40,90,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132a;--bg2:#241d3d;--card:#211a38;--tx:#f4eefa;--mut:#bdb1d3;--line:#3a3060;--g:#9aa0ff;--g2:#6b72e0;--gold:#ffc468;--tc:#4fd6d6;--bl:#ff7fc0;--ok:#5fd39a;--okBg:#0f3a2b;--bad:#ff8fa0;--badBg:#4a1d2b;--warn:#ffc46b;--sh:0 6px 18px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#17132a;--bg2:#241d3d;--card:#211a38;--tx:#f4eefa;--mut:#bdb1d3;--line:#3a3060;--g:#9aa0ff;--g2:#6b72e0;--gold:#ffc468;--tc:#4fd6d6;--bl:#ff7fc0;--ok:#5fd39a;--okBg:#0f3a2b;--bad:#ff8fa0;--badBg:#4a1d2b;--warn:#ffc46b;--sh:0 6px 18px rgba(0,0,0,.45)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px,var(--bg);color:var(--tx);font:16px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 70px}
h2{font-size:1.15rem;margin:18px 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
.hero{position:relative;border-radius:22px;overflow:hidden;margin:0 0 16px;box-shadow:var(--sh);background:linear-gradient(160deg,#272a74,#7a2e86 55%,#f2a541);color:#fff;min-height:210px}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .tx{position:relative;padding:24px 22px 70px;max-width:640px}
.hero h1{font:800 clamp(1.4rem,5vw,2.1rem)/1.15 Georgia,"Noto Serif","Times New Roman",serif;margin:0 0 8px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.hero p{margin:0;opacity:.95;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.pills{position:absolute;left:18px;right:18px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
.pills span{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 12px;font-size:.84rem;font-weight:600;backdrop-filter:blur(4px)}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
label.f{display:block;font-weight:700;margin-bottom:6px}
input[type=text],textarea{width:100%;padding:12px 14px;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--line);border-radius:12px}
input[type=text]:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--g) 40%,transparent);border-color:var(--g)}
textarea{min-height:120px;resize:vertical}
[aria-invalid=true]{border-color:var(--bad)!important}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:10px;color:var(--mut);cursor:pointer}.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--g);flex:none}
.err{color:var(--bad);font-weight:700;margin:8px 0 0}.err:empty{display:none}.note{color:var(--warn);margin:8px 0 0}.note:empty{display:none}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);padding:8px 0;margin-bottom:6px}
.pbar{height:12px;background:var(--bg2);border:1px solid var(--line);border-radius:99px;overflow:hidden}.pbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--gold));border-radius:99px;transition:width .35s}
.pt{font-size:.88rem;color:var(--mut);margin-top:4px;font-weight:600}
.h{display:block;color:#fff;border-radius:14px;padding:10px 16px;font-size:1.1rem;margin:28px 0 14px;box-shadow:var(--sh)}
.s1{background:linear-gradient(90deg,#272a74,#4b50c0)}.s2{background:linear-gradient(90deg,#0a6466,#12a3a5)}.s3{background:linear-gradient(90deg,#7a1f52,#c2417f)}
fieldset{border:2px solid var(--line);border-left:7px solid var(--g);background:var(--card);border-radius:18px;margin:0 0 16px;padding:12px 14px 6px;min-width:0;box-shadow:var(--sh)}
fieldset[data-sec="2"]{border-left-color:var(--tc)}fieldset[data-sec="3"]{border-left-color:var(--bl)}
fieldset.miss{border-color:var(--bad);box-shadow:0 0 0 4px var(--badBg)}
legend{padding:2px 14px;font-weight:800;font-size:.85rem;color:#fff;background:var(--g2);border-radius:99px}
fieldset[data-sec="2"] legend{background:var(--tc)}fieldset[data-sec="3"] legend{background:var(--bl)}
.qt{font-weight:700;margin:6px 0 12px;overflow-wrap:anywhere;font-size:1.04rem}
.ops{display:grid;gap:10px;margin-bottom:10px}
.opt,.ev{display:flex;gap:12px;align-items:center;padding:11px 14px;border:2px solid var(--line);background:var(--bg);border-radius:14px;overflow-wrap:anywhere;min-height:48px;transition:transform .12s,box-shadow .12s,border-color .12s}
.opt{cursor:pointer}.opt:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--g)}
.opt input{width:18px;height:18px;accent-color:var(--g);flex:none}
.opt b,.ev .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--bg2);color:var(--g2);display:grid;place-items:center;font-size:.85rem;font-weight:800}
.opt:has(input:checked){border-color:var(--g);background:color-mix(in srgb,var(--g) 14%,var(--card));font-weight:600}
.opt:has(input:checked) b{background:var(--g2);color:#fff}
.opt.ok,.ev.ok{border-color:var(--ok);background:var(--okBg);animation:pop .4s}.opt.no,.ev.no{border-color:var(--bad);background:var(--badBg);animation:shake .4s}
.opt.ok::after{content:"✓";margin-left:auto;font-weight:900;color:var(--ok)}.opt.no::after{content:"✗";margin-left:auto;font-weight:900;color:var(--bad)}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#ol{list-style:none;margin:0 0 10px;padding:0}.ev{margin:0 0 10px}.ev .t{flex:1;min-width:0}
.ev .mv{display:flex;gap:6px;flex:none}.ev .mv button{padding:4px 10px;min-height:40px;min-width:42px;border-radius:10px;font-size:1.1rem;background:var(--card);color:var(--g2);border-color:var(--line)}.ev .mv button:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.ev.ok .n{background:var(--ok);color:#fff}.ev.no .n{background:var(--bad);color:#fff}
.fb{font-size:.92rem;margin:0 0 8px;font-weight:700;overflow-wrap:anywhere}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}.cor{margin:0 0 8px;padding-left:22px;font-size:.92rem;color:var(--mut)}
.cnt{font-size:.82rem;color:var(--mut);text-align:right;margin:2px 0 8px}
button{font:inherit;font-weight:700;border-radius:14px;padding:13px 22px;border:2px solid var(--g);cursor:pointer;min-height:46px;transition:transform .12s,box-shadow .12s}
button:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.pri{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-color:transparent}.sec{background:transparent;color:var(--g)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
#sub{font-size:1.1rem;padding:15px 30px}
#res{border:3px solid var(--gold)}
.gauge{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:6px 0 10px}
.medal{font-size:3rem;line-height:1;text-align:center}.medal b{display:block;font-size:1.3rem;margin-top:4px}
.tp{margin:10px 0}.tp div.r{display:flex;justify-content:space-between;gap:8px;font-size:.94rem;font-weight:600}.tp .pbar{height:12px;margin-top:4px}
.an{border-left:5px solid var(--bad);background:var(--badBg);border-radius:0 12px 12px 0;padding:8px 12px;margin:10px 0;overflow-wrap:anywhere}
.an p,.oa p{margin:2px 0}.oa{border-left:5px solid var(--bl);background:color-mix(in srgb,var(--bl) 9%,var(--card));border-radius:0 12px 12px 0;padding:8px 12px;margin:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.hist{font-size:.9rem;color:var(--mut);padding-left:18px;margin:6px 0 0}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
[hidden]{display:none!important}
@media(max-width:480px){.hero .tx{padding:18px 16px 76px}.ev{flex-wrap:wrap}.ev .mv{margin-left:auto}}
@media(max-width:380px){.wrap{padding:10px 8px 50px}.opt{padding:9px 10px}button{padding:11px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff;color:#000}.stick,.btns,#start,#qs,#subRow,#subErr,.sub,.hero{display:none!important}.card{box-shadow:none}}
</style></head><body>
<a href="index.html#tasks" style="position:fixed;bottom:12px;left:12px;z-index:2147483647;padding:8px 14px;border:1px solid #e5b971;border-radius:8px;background:#102739;color:#fff;font:14px Arial,sans-serif;text-decoration:none;box-shadow:0 2px 10px #0003" aria-label="Тапсырмалар бөліміне қайту">← Тапсырмалар</a><div class="wrap">
<header class="hero"><svg viewBox="0 0 800 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><circle cx="640" cy="120" r="46" fill="#ffd98a" opacity=".9"/><path d="M0 220V150H60V120H90V150H150V100H175V80H190V100H215V150H300V130H380V150H470V110H500V90H515V110H545V150H640V135H720V150H800V220Z" fill="#1d1650" opacity=".8"/><path d="M0 220V185Q100 165 200 185T400 185T600 185T800 180V220Z" fill="#120e38"/><g fill="#fff" opacity=".85"><circle cx="80" cy="198" r="5"/><circle cx="140" cy="203" r="4"/><circle cx="230" cy="197" r="5"/><circle cx="330" cy="202" r="4"/><circle cx="450" cy="198" r="5"/><circle cx="560" cy="203" r="4"/><circle cx="680" cy="198" r="5"/></g></svg><div class="tx"><h1>Мәмбетәлі Бағызбаевтың өмір жолы мен тағдыры</h1><p>Мақта өнеркәсібін құрушы және қуғын-сүргін құрбаны туралы тапсырмалар</p></div><div class="pills"><span>8 ұпайлы тапсырма</span><span>3 ашық сұрақ</span><span>Интернетсіз жұмыс істейді</span></div></header>

<div class="card" id="start">
 <label class="f" for="nm">Аты-жөніңіз</label>
 <input type="text" id="nm" maxlength="60" autocomplete="name" placeholder="Мысалы: Айдос Серіков" aria-describedby="nmErr">
 <p class="err" id="nmErr" role="alert"></p>
 <label class="chk"><input type="checkbox" id="sv"> Нәтижені осы құрылғыда сақтау</label>
</div>

<div class="stick" id="stick"><div class="pbar"><b id="pb"></b></div><div class="pt" id="pt"></div></div>
<div id="qs"></div>
<p class="err" id="subErr" role="alert"></p>
<div class="btns" id="subRow"><button class="pri" id="sub">Тестті аяқтау</button></div>

<div class="card" id="res" hidden tabindex="-1" aria-live="polite"></div>
</div>
<script>
const Q=[
["Мәмбетәлі Бағызбаев 1924–1927 жылдары қандай ірі өндіріс орындарын ұйымдастырып, басқарды?",["Түлкібастағы жеміс өңдеу комбинаттарын","«Келес», «Ходжейт» және «Пахтаарал» мақта зауыттарын","Қорғасын және фосфор зауыттарын","Астық қабылдау пункттерін"],[1]],
["1928–1932 жылдары М. Бағызбаев қандай қызмет атқарды?",["Түркістан Халық Комиссарлары Кеңесінің төрағасы","Шымкент мақта пресінің директоры","«Амангелді» колхозының төрағасы","Аудандық партия комитетінің хатшысы"],[1]],
["1937 жылы кімге «халық жауы» айыбының тағылуы Мәмбетәлі Бағызбаевтың да тұтқындалуына тікелей себеп болды?",["Тұрар Рысқұловқа","Смағұл Сәдуақасовқа","Ораз Жандосовқа","Санжар Асфендияровқа"],[0]],
["М. Бағызбаев тұтқындалғаннан кейінгі күні оның жұбайы Сұлухан қандай айыппен қамауға алынды?","Мемлекет мүлкін талан-таражға салғаны үшін|«Халық жауының әйелі» болғаны үшін|Мақта жоспарын орындамағаны үшін|Шетелдік тыңшылармен байланысы үшін".split('|'),[1]],
["Мәмбетәлі Бағызбаевтың үлкен ұлы Сұлтанбектің тағдыры қалай аяқталды?",["Әкесімен бірге ату жазасына кесілді","Шетелге қоныс аударды","Орскідегі НКВД балалар үйінен майданға аттанып, 1944 жылы хабар-ошарсыз кетті","Соғыстан аман оралып, туған жерінде еңбек етті"],[2]],
["Бағызбаевтың алты жастағы қызы Махира (Мая) пойызда бауырларынан бөлініп алынып, қайда жөнелтілді?",["Ресейдің Сорочинск қаласындағы балалар үйіне","Алматыдағы мектеп-интернатқа","Шымкенттегі туыстарына","Сібірге мәжбүрлі еңбекке"],[0]],
["Мәмбетәлі Бағызбаев қай жылы қайтыс болды?",["1932 жылы","1937 жылы","1938 жылы","1944 жылы"],[2]]];
const E=[["Мәмбетәлі Бағызбаевтың Шымкент мақта пресінің директоры болып қызмет етуі.","1928–1932 жж.",2],["Мәмбетәлі Бағызбаевтың қайтыс болуы (атылуы).","1938 ж.",4],["Мәмбетәлі Бағызбаевтың «Келес», «Ходжейт», «Пахтаарал» мақта зауыттарын ұйымдастыруы.","1924–1927 жж.",1],["Бағызбаевтың ұлы Сұлтанбектің майданда хабар-ошарсыз кетуі.","1944 ж.",5],["Тұрар Рысқұловқа «халық жауы» айыбы тағылып, іле-шала Мәмбетәлі Бағызбаевтың тұтқындалуы.","1937 ж.",3]];
const COR=E.map((_,i)=>i).sort((a,b)=>E[a][2]-E[b][2]);
const O=["Кеңестік тоталитарлық жүйенің репрессиялық саясаты «халық жауы» деп танылған адамның отбасына қандай зардап әкелді? Осы қасіретті М. Бағызбаевтың жұбайы Сұлухан мен балаларының (Сұлтанбек, Зоя, Махира) тағдыры мысалында талдап жазыңыз.",
"Тұрар Рысқұловтың қудалануының Мәмбетәлі Бағызбаевқа тікелей әсер етуі 1937 жылғы саяси қуғын-сүргіннің қандай механизмін көрсетеді? Осы тарихи фактіге сүйене отырып, жүйенің жазалау сипатына баға беріңіз.",
"Мәмбетәлі Бағызбаевтың Қазақстанның оңтүстігіндегі мақта шаруашылығын дамытуға (зауыттар құру, өндірісті басқару) қосқан үлесі мен оның өмірінің соңындағы тарихи әділетсіздікті қалай бағалайсыз? Тұлғаның еңбегі мен тағдыры арасындағы қайшылықты қорытындылаңыз."];
const NQ=Q.length,TOT=NQ+1,L='АӘБВ',KEY='kt-baghyzbaev-results',MIN=15;
const TP=[[0,NQ,'І бөлім. Білу және түсіну (1–7)'],[NQ,TOT,'ІІ бөлім. Қолдану және талдау (8)']];
const $=s=>document.querySelector(s);let order,ans,seq,moved;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const same=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
const txt=(i,a)=>a.map(o=>Q[i][1][o]).join('; ');
const oTxt=i=>$('#o'+i).value.trim();
function build(){
 order=Q.map(()=>shuf([0,1,2,3]));ans=Q.map(()=>[]);moved=false;
 do{seq=shuf(E.map((_,i)=>i))}while(same(seq,COR));
 const box=$('#qs');box.replaceChildren();
 box.append(el('h2','h s1','І. Бір дұрыс жауабы бар 7 тест сұрағы'));
 Q.forEach((q,i)=>{
  const fs=el('fieldset');fs.id='q'+i;fs.dataset.sec='1';fs.append(el('legend',null,'Сұрақ '+(i+1)),el('p','qt',q[0]));
  const ops=el('div','ops');fs.append(ops);
  order[i].forEach((oi,k)=>{
   const lb=el('label','opt'),r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=oi;
   r.onchange=()=>{ans[i]=[oi];fs.classList.remove('miss');prog();$('#subErr').textContent=''};
   lb.append(r,el('b',null,L[k]),el('span',null,q[1][oi]));ops.append(lb)});
  box.append(fs)});
 box.append(el('h2','h s2','ІІ. Хронологиялық реттілікке қою тапсырмасы'));
 const fo=el('fieldset');fo.id='q'+NQ;fo.dataset.sec='2';
 fo.append(el('legend',null,'Сұрақ '+(NQ+1)),el('p','qt','Төмендегі 5 тарихи оқиғаны болған уақытына қарай дұрыс хронологиялық ретпен орналастырыңыз. Оқиғаны ↑ ↓ түймелерімен жылжытыңыз: ең ерте оқиға жоғарыда болсын.'));
 const ol=el('ol');ol.id='ol';fo.append(ol);box.append(fo);renderSeq();
 box.append(el('h2','h s3','ІІІ. Қысқаша жауапты қажет ететін ашық сұрақтар'),el('p','sub','Бұл жауаптарды мұғалім тексереді, ұпайға кірмейді. Кемінде '+MIN+' таңба жазыңыз.'));
 O.forEach((t,i)=>{const fs=el('fieldset');fs.id='of'+i;fs.dataset.sec='3';fs.append(el('legend',null,'Сұрақ '+(NQ+2+i)),el('p','qt',t));
  const ta=document.createElement('textarea');ta.id='o'+i;ta.maxLength=1500;ta.setAttribute('aria-label',(NQ+2+i)+'-сұраққа жауап');
  const c=el('div','cnt','0 / 1500');ta.oninput=()=>{c.textContent=ta.value.length+' / 1500';ta.removeAttribute('aria-invalid');fs.classList.remove('miss');prog();$('#subErr').textContent=''};
  fs.append(ta,c);box.append(fs)});
 $('#res').hidden=true;$('#subRow').hidden=false;$('#stick').hidden=false;$('#nm').disabled=false;$('#sv').disabled=false;$('#subErr').textContent='';prog();
}
function renderSeq(){const ol=$('#ol');ol.replaceChildren();
 seq.forEach((ei,p)=>{const li=el('li','ev');li.append(el('span','n',p+1),el('span','t',E[ei][0]));
  const mv=el('div','mv');[['↑',-1,'Жоғары жылжыту'],['↓',1,'Төмен жылжыту']].forEach(([s,d,a])=>{const b=el('button',null,s);b.type='button';b.setAttribute('aria-label',a);b.disabled=p+d<0||p+d>=seq.length;
   b.onclick=()=>{[seq[p],seq[p+d]]=[seq[p+d],seq[p]];moved=true;$('#q'+NQ).classList.remove('miss');renderSeq();prog();$('#subErr').textContent=''};mv.append(b)});
  li.append(mv);ol.append(li)})}
function prog(){const n=ans.filter(a=>a.length).length+(moved?1:0)+O.filter((_,i)=>oTxt(i).length>=MIN).length,t=TOT+O.length;$('#pb').style.width=n/t*100+'%';$('#pt').textContent='Жауап берілді: '+n+' / '+t}
function submit(){
 const nm=$('#nm'),v=nm.value.trim(),ne=$('#nmErr');
 if(v.length<2||v.length>60||!/\p{L}/u.test(v)){nm.setAttribute('aria-invalid','true');ne.textContent='Аты-жөніңізді жазыңыз (кемінде 2 әріп, 60 таңбадан аспасын).';nm.focus();nm.scrollIntoView({block:'center'});return}
 nm.removeAttribute('aria-invalid');ne.textContent='';
 const miss=[],mo=[];ans.forEach((a,i)=>{if(!a.length)miss.push(i)});if(!moved)miss.push(NQ);O.forEach((_,i)=>{if(oTxt(i).length<MIN)mo.push(i)});
 if(miss.length||mo.length){miss.forEach(i=>$('#q'+i).classList.add('miss'));mo.forEach(i=>{$('#of'+i).classList.add('miss');$('#o'+i).setAttribute('aria-invalid','true')});
  $('#subErr').textContent=(miss.length?'Жауап берілмеген тапсырмалар: '+miss.map(i=>i+1).join(', ')+(miss.includes(NQ)?' (8-тапсырмада оқиғаларды жылжытып, ретін өзгертіңіз)':'')+'. ':'')+(mo.length?'Ашық сұраққа жауап жазыңыз (кемінде '+MIN+' таңба): '+mo.map(i=>NQ+2+i).join(', ')+'.':'');
  const f=miss.length?$('#q'+miss[0]):$('#of'+mo[0]);f.scrollIntoView({block:'center',behavior:'smooth'});return}
 finish(v)}
function corList(){const ol=el('ol','cor');COR.forEach(i=>ol.append(el('li',null,E[i][0]+' ('+E[i][1]+')')));return ol}
function gauge(sc,pc){const d=el('div','gauge'),C=2*Math.PI*54,col=pc>=70?'var(--ok)':pc>=50?'var(--gold)':'var(--bad)';
 d.innerHTML='<svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="'+sc+' / '+TOT+'"><circle cx="60" cy="60" r="54" fill="none" style="stroke:var(--bg2)" stroke-width="12"/><circle class="gc" cx="60" cy="60" r="54" fill="none" style="stroke:'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" transform="rotate(-90 60 60)"/><text x="60" y="58" text-anchor="middle" font-size="30" font-weight="800" style="fill:currentColor">'+sc+'</text><text x="60" y="78" text-anchor="middle" font-size="12" style="fill:var(--mut)">/ '+TOT+' ұпай</text></svg><div class="medal">'+(pc>=90?'🏆':pc>=70?'🥇':pc>=50?'🥈':'🌱')+'<b>'+pc+'%</b></div>';
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=d.querySelector('.gc');g.style.transition='stroke-dashoffset 1s ease';g.style.strokeDashoffset=C*(1-pc/100)}));return d}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=['#f2a541','#3b3f9e','#0f8b8d','#a3306f'],w=el('div','cf');for(let i=0;i<40;i++){const p=el('i');p.style.cssText='left:'+Math.random()*100+'%;background:'+c[i%4]+';animation-delay:'+Math.random()*.6+'s;animation-duration:'+(2+Math.random()*1.5)+'s';w.append(p)}document.body.append(w);setTimeout(()=>w.remove(),4500)}
function finish(name){
 let sc=0;const bad=[],tp=TP.map(()=>0);
 Q.forEach((q,i)=>{
  const fs=$('#q'+i),ok=same(ans[i],q[2]);if(ok){sc++;tp[0]++}else bad.push(i);
  fs.querySelectorAll('.opt').forEach((lb,k)=>{const oi=order[i][k];lb.querySelector('input').disabled=true;if(q[2].includes(oi))lb.classList.add('ok');else if(ans[i].includes(oi))lb.classList.add('no')});
  fs.append(el('p','fb '+(ok?'ok':'no'),ok?'Дұрыс':'Қате. Дұрыс жауап: '+txt(i,q[2])))});
 const okO=same(seq,COR),fo=$('#q'+NQ);if(okO){sc++;tp[1]++}
 fo.querySelectorAll('.ev').forEach((li,p)=>{li.classList.add(E[seq[p]][2]===p+1?'ok':'no');li.querySelectorAll('button').forEach(b=>b.disabled=true)});
 fo.append(el('p','fb '+(okO?'ok':'no'),okO?'Дұрыс':'Қате. Дұрыс хронологиялық тізбек:'));if(!okO)fo.append(corList());
 O.forEach((_,i)=>{$('#o'+i).readOnly=true});
 const pc=Math.round(sc/TOT*100),r=$('#res');r.replaceChildren();
 r.append(el('h2',null,'Нәтиже: '+name),gauge(sc,pc),
  el('p',null,pc>=90?'Тамаша нәтиже!':pc>=70?'Жақсы нәтиже.':pc>=50?'Қанағаттанарлық. Қателерді талдап, тақырыпты қайталаңыз.':'Тақырыпты қайта оқып, тестті қайталап көріңіз.'),el('p','sub','Ашық сұрақтар (9–11) мұғалім тексеруіне жіберіледі, ұпайға кірмейді.'));
 TP.forEach((t,k)=>{const n=t[1]-t[0],d=el('div','tp'),row=el('div','r');row.append(el('span',null,t[2]),el('b',null,tp[k]+' / '+n));const b=el('div','pbar'),f=el('b');f.style.width=tp[k]/n*100+'%';b.append(f);d.append(row,b);r.append(d)});
 const nb=bad.length+(okO?0:1);r.append(el('h2',null,nb?'Қателерді талдау ('+nb+')':'Қате жоқ!'));
 bad.forEach(i=>{const d=el('div','an'),q=Q[i];d.append(el('p',null,'№'+(i+1)+'. '+q[0]),el('p',null,'Сіздің жауабыңыз: '+txt(i,ans[i])),el('p',null,'Дұрыс жауап: '+txt(i,q[2])));r.append(d)});
 if(!okO){const d=el('div','an');d.append(el('p',null,'№'+(NQ+1)+'. Хронологиялық реттілік'),el('p',null,'Сіздің тізбегіңіз: '+seq.map(i=>E[i][1]).join(' → ')),el('p',null,'Дұрыс тізбек:'),corList());r.append(d)}
 r.append(el('h2',null,'Ашық сұрақтарға жауаптарыңыз'));
 O.forEach((t,i)=>{const d=el('div','oa');d.append(el('p',null,'№'+(NQ+2+i)+'. '+t),el('p',null,oTxt(i)));r.append(d)});
 const sm=el('p','note');r.append(sm);
 if($('#sv').checked){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');a.unshift({n:name,s:sc,t:TOT,d:new Date().toLocaleString('kk-KZ')});localStorage.setItem(KEY,JSON.stringify(a.slice(0,5)));sm.style.color='var(--ok)';sm.textContent='Нәтиже осы құрылғыда сақталды (ашық жауаптар сақталмайды).';
  r.append(el('p',null,'Соңғы сақталған нәтижелер:'));const u=el('ul','hist');a.slice(0,5).forEach(x=>u.append(el('li',null,x.d+': '+x.n+', '+x.s+'/'+x.t)));r.append(u)}catch(e){sm.textContent='Нәтижені сақтау мүмкін болмады: браузер жадқа рұқсат бермейді. Нәтиже тек осы бетте көрсетіледі.'}}
 const bt=el('div','btns'),re=el('button','pri','Қайта орындау');re.onclick=()=>{build();scrollTo({top:0,behavior:'smooth'})};
 const pr=el('button','sec','Басып шығару');pr.onclick=()=>print();bt.append(re,pr);r.append(bt);
 if(pc>=70)confetti();r.hidden=false;$('#subRow').hidden=true;$('#stick').hidden=true;$('#nm').disabled=true;$('#sv').disabled=true;r.focus();r.scrollIntoView({behavior:'smooth'})}
$('#sub').onclick=submit;
$('#nm').addEventListener('input',()=>{$('#nm').removeAttribute('aria-invalid');$('#nmErr').textContent=''});
build();
</script></body></html>
